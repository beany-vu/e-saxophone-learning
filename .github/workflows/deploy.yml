name: Deploy to production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Queue deploys rather than cancelling them. Cancelling mid-swap can leave the
# stack half-recreated, which is worse than waiting for the previous run.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # One job, entirely on the self-hosted runner. GitHub-hosted runners are not
  # available on this account, so nothing here may use `runs-on: ubuntu-latest`.
  # The tests run first and in throwaway containers, so a red test stops the
  # deploy before anything production-facing is touched.
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    env:
      COMPOSE_FILE: docker-compose.prod.yml
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      # Optional; the compose file carries a default for each.
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      WEB_PUBLIC_URL: ${{ vars.WEB_PUBLIC_URL }}
      # A secret rather than a variable. It is not a credential, but this repo
      # is public: secrets are masked in the Actions logs anyone can read, and
      # it keeps one person's address out of a codebase meant for anyone to
      # run. Optional: unset means the stack comes up with no admin at all.
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      COMPOSE_HTTP_TIMEOUT: 300
      DOCKER_CLIENT_TIMEOUT: 300

    steps:
      - name: Check Docker is responsive
        shell: bash
        run: |
          for i in $(seq 1 12); do
            docker info > /dev/null 2>&1 && echo "Docker is responsive" && exit 0
            echo "  waiting for Docker... ($((i*5))s / 60s)"
            sleep 5
          done
          echo "Docker is not responding after 60s. Is Docker Desktop running with WSL integration on?" >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          missing=0
          for v in POSTGRES_PASSWORD JWT_SECRET CLOUDFLARE_TUNNEL_TOKEN; do
            val="${!v}"
            if [ -z "$val" ]; then
              echo "$v is missing" >&2
              missing=1
            else
              echo "$v present (${#val} chars)"
            fi
          done
          [ $missing -eq 0 ] || { echo "Aborting - set the missing repository secrets." >&2; exit 1; }

      - name: Backend tests
        shell: bash
        run: |
          # A throwaway database on its own network, named per run so a stale
          # container from a cancelled run can never be reused. The production
          # stack is untouched.
          NET="esax-test-${GITHUB_RUN_ID}"
          DB="esax-test-db-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$DB" > /dev/null 2>&1 || true
            docker network rm "$NET" > /dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$NET" > /dev/null
          docker run -d --name "$DB" --network "$NET" \
            -e POSTGRES_USER=yds -e POSTGRES_PASSWORD=test_pw -e POSTGRES_DB=yds120 \
            --health-cmd "pg_isready -U yds -d yds120" \
            --health-interval 5s --health-timeout 5s --health-retries 12 \
            postgres:16-alpine > /dev/null

          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$DB")" = "healthy" ] && break
            echo "  waiting for the test database... ($i/30)"
            sleep 2
          done

          # The build stage already carries the source and the module cache,
          # so the tests need no host mount and leave nothing in the workspace.
          docker build -f backend/Dockerfile --target build -t esax-api-test backend
          docker run --rm --network "$NET" -w /src \
            -e DATABASE_URL="postgres://yds:test_pw@${DB}:5432/yds120?sslmode=disable" \
            -e JWT_SECRET=test-secret \
            esax-api-test go test ./... -count=1

      - name: Frontend tests
        shell: bash
        run: |
          # --target build runs `next build` too, so a type or build error
          # fails here rather than during the swap.
          docker build -f frontend/Dockerfile.prod --target build -t esax-web-test frontend
          docker run --rm esax-web-test npm test

      - name: Build images
        shell: bash
        # The currently running containers keep serving traffic throughout.
        run: docker compose build api web

      - name: Start the database
        shell: bash
        run: docker compose up -d --no-build db

      - name: Swap to the new containers
        shell: bash
        run: |
          docker compose up -d --no-build --force-recreate api web
          # --no-deps: the tunnel must not wait on the web healthcheck here.
          # The dedicated wait below is the real verification.
          docker compose up -d --no-deps cloudflare-tunnel

      - name: Wait for a healthy stack
        shell: bash
        run: |
          wait_for() {
            for i in $(seq 1 40); do
              curl -sf "$1" > /dev/null 2>&1 && { echo "$2 is up"; return 0; }
              echo "  waiting for $2... ($i/40)"
              sleep 3
            done
            echo "$2 never came up" >&2
            docker compose logs --tail=40 "$3" || true
            return 1
          }
          wait_for http://127.0.0.1:8090/health API api
          wait_for http://127.0.0.1:3010/ web web

      - name: Show status
        if: always()
        shell: bash
        run: timeout 20 docker compose ps || true

      - name: Clean up test images
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          docker image rm -f esax-api-test esax-web-test > /dev/null 2>&1 || true
          docker image prune -f

      - name: Report failure logs
        if: failure()
        shell: bash
        run: timeout 20 docker compose logs --tail=50 api web cloudflare-tunnel 2>/dev/null || echo "could not fetch logs"
